<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#111827"
  >

  <title>Vikas Saptah '26 - Scanner</title>

  <link
    rel="stylesheet"
    href="./style.css"
  >

</head>


<body>

  <div class="app">

    <!-- HEADER -->

    <header class="header">

      <h1>
        Vikas Saptah '26
      </h1>

      <p>
        Volunteer Check-in Scanner
      </p>

    </header>


    <!-- SCANNER CARD -->

    <section class="card">

      <h2>
        📷 Scan Registration QR
      </h2>

      <p class="muted">
        Point the camera at the attendee's QR code.
      </p>


      <div
        id="reader"
        class="reader"
      ></div>


      <div
        id="scannerStatus"
        class="scanner-status"
      >
        Scanner ready
      </div>


      <button
        id="startScannerBtn"
        class="btn btn-dark"
      >
        📷 START QR SCANNER
      </button>


      <button
        id="stopScannerBtn"
        class="btn btn-danger hidden"
      >
        🛑 STOP SCANNER
      </button>


      <div
        id="cameraMessage"
        class="message-area"
      ></div>

    </section>


    <!-- MANUAL SEARCH -->

    <section class="card">

      <h2>
        🔎 Find Registration
      </h2>

      <input
        id="registrationId"
        type="text"
        placeholder="VS26-0001"
        autocomplete="off"
        autocapitalize="characters"
      >


      <button
        id="findBtn"
        class="btn btn-primary"
      >
        FIND REGISTRATION
      </button>

    </section>


    <!-- RESULT -->

    <section
      id="resultCard"
      class="card hidden"
    >

      <div id="result"></div>

    </section>

  </div>


  <!-- QR LIBRARY -->

  <script
    src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"
  ></script>


  <!-- OUR APP -->

  <script src="./app.js"></script>

</body>

</html>
