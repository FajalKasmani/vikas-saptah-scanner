<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Vikas Saptah '26 - Scanner</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

  <!-- QR SCANNER -->
  <script
    src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js">
  </script>

</head>


<body>


<div class="app">


  <!-- HEADER -->

  <header class="header">

    <div class="event-name">
      VIKAS SAPTAH '26
    </div>

    <div class="desk-name">
      Volunteer Check-in Desk
    </div>

  </header>


  <!-- SCANNER -->

  <section class="card">

    <h2>
      📷 Scan Registration QR
    </h2>

    <p class="subtext">
      Scan attendee's registration QR code
    </p>


    <div
      id="reader"
      class="reader"
    ></div>


    <div
      id="scannerStatus"
      class="scanner-status"
    >
      Scanner ready
    </div>


    <button
      id="startScannerBtn"
      class="btn btn-dark"
      onclick="startScanner()"
    >
      📷 START QR SCANNER
    </button>


    <button
      id="stopScannerBtn"
      class="btn btn-danger hidden"
      onclick="stopScanner()"
    >
      🛑 STOP SCANNER
    </button>


  </section>


  <!-- MANUAL SEARCH -->

  <section class="card">

    <h3>
      Manual Registration ID
    </h3>

    <input
      id="registrationId"
      type="text"
      placeholder="Example: VS26-0001"
      autocomplete="off"
    >


    <button
      class="btn btn-primary"
      onclick="findAttendee()"
    >
      🔎 FIND REGISTRATION
    </button>


    <p class="divider">
      OR SCAN QR ABOVE
    </p>

  </section>


  <!-- RESULT -->

  <section
    id="resultCard"
    class="card hidden"
  >

    <div id="result"></div>

  </section>


</div>


<script src="app.js"></script>

</body>

</html>
