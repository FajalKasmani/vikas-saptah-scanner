<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#111827"
  >

  <title>Vikas Saptah '26 - Scanner</title>

  <link
    rel="stylesheet"
    href="./style.css"
  >

</head>


<body>

  <div class="app">

    <!-- HEADER -->

    <header class="header">

      <h1>
        Vikas Saptah '26
      </h1>

      <p>
        Volunteer Check-in Scanner
      </p>

    </header>


    <!-- QR SCANNER -->

    <section class="card">

      <h2>
        QR Scan Registration
      </h2>

      <p class="muted">
        Point the camera at the attendee's QR code.
      </p>


      <div
        id="reader"
        class="reader"
      ></div>


      <div
        id="scannerStatus"
        class="scanner-status"
      >
        Scanner ready
      </div>


      <button
        id="startScannerBtn"
        type="button"
        class="btn btn-dark"
      >
        START QR SCANNER
      </button>


      <button
        id="stopScannerBtn"
        type="button"
        class="btn btn-danger hidden"
      >
        STOP SCANNER
      </button>


      <div
        id="cameraMessage"
        class="message-area"
      ></div>

    </section>


    <!-- MANUAL SEARCH -->

    <section class="card">

      <h2>
        Find Registration
      </h2>

      <p class="muted">
        Enter the Registration ID manually if QR scanning is not available.
      </p>


      <div class="registration-input">
  <span class="registration-prefix">VS26-</span>

  <input
    id="registrationId"
    type="tel"
    inputmode="numeric"
    pattern="[0-9]*"
    placeholder="0001"
    autocomplete="off"
  >
</div>


      <button
        id="findBtn"
        type="button"
        class="btn btn-primary"
      >
        FIND REGISTRATION
      </button>

    </section>


    <!-- RESULT -->

    <section
      id="resultCard"
      class="card hidden"
    >

      <div id="result"></div>

    </section>

  </div>


  <!-- QR SCANNER LIBRARY -->

  <script
    src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"
  ></script>


  <!-- APPLICATION JS -->

  <script
    src="./app.js"
  ></script>

</body>

</html>
